version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hassdash4linux-ui"
path = "src/main.rs"

[dependencies]
hd-core.workspace = true
hd-ha.workspace = true
