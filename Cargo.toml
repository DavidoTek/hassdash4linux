[workspace]
resolver = "3"
members = ["crates/hd-core", "crates/hd-ha", "crates/hd-daemon", "crates/hd-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/DavidoTek/hassdash4linux"
homepage = "https://github.com/DavidoTek/hassdash4linux"
rust-version = "1.88"

[workspace.dependencies]
hd-core = { path = "crates/hd-core" }
hd-ha = { path = "crates/hd-ha" }

tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "io-util", "process", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
base64 = "0.22"
ring = "0.17"
zeroize = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json"] }
crypto_secretbox = { version = "0.1", default-features = false, features = ["alloc", "salsa20"] }
oo7 = { version = "0.5", default-features = false, features = ["tokio", "native_crypto"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
png = "0.17"
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
