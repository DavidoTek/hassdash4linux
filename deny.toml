# cargo-deny configuration: `cargo deny check` (available in `nix develop`).

[graph]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerabilities, unmaintained, unsound, yanked).
version = 2
yanked = "deny"
ignore = [
  # zbus 5's helper crates were merged into zbus 6. ksni and oo7 still
  # depend on zbus 5; migrate when they support zbus 6. Not a vulnerability.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; blocked on ksni/oo7" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; blocked on ksni/oo7" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; blocked on ksni/oo7" },
]

[licenses]
version = 2
# Licenses compatible with GPL-3.0-or-later.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "LGPL-2.1-or-later",
  "OpenSSL",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (all crates are publish = false).
allow-wildcard-paths = true
# hassdash4linux must not grow a C TLS stack or a second async runtime.
deny = [
  { crate = "openssl-sys" },
  { crate = "native-tls" },
  { crate = "async-std" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
